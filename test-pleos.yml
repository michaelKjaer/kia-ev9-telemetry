name: Test Pleos connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Pleos authentication
        env:
          PLEOS_CLIENT_ID: ${{ secrets.PLEOS_CLIENT_ID }}
          PLEOS_CLIENT_SECRET: ${{ secrets.PLEOS_CLIENT_SECRET }}
        run: python test_pleos.py
